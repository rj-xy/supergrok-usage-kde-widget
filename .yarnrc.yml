# yaml-language-server: $schema=https://yarnpkg.com/configuration/yarnrc.json
# Yarn's manifest file. You can configure yarn here.
# See https://yarnpkg.com/configuration/yarnrc.

# For `node_modules` (see `nodeLinker` below), this is almost always the preferred option.
compressionLevel: 0

enableGlobalCache: true

# Lets yarn use hardlinks inside `node_modules` to dedupe packages.
# For a more pnpm-like experience, consider `hardlinks-global` where hardlinks point to a global store.
nmMode: hardlinks-local

# How to install Node packages.
# Heads up: right now, Cedar expects this to be `node-modules`.
nodeLinker: node-modules

# Minimum age of a package version according to the publish date on the npm registry to be considered for installation.
# If a package version is newer than the minimal age gate, it will not be considered for installation.
# This can be used to reduce the likelihood of installing compromised packages, or to avoid relying on packages that could
#   still be unpublished (e.g. the npm registry has specific rules for packages less than 3 days old).
npmMinimalAgeGate: '3d'
